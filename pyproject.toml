[project]
name = "glados"
version = "0.1.0"
description = "Zero-latency, non-autoregressive LLM security firewall and intelligence-tier router powered by ModernBERT"
readme = "README.md"
authors = [
    { name = "bearcut", email = "7.shiven@gmail.com" }
]
requires-python = ">=3.14"
dependencies = [
    "torch>=2.2.0",
    "transformers>=4.48.0",
    "datasets>=2.18.0",
    "accelerate>=0.28.0",
    "fastapi>=0.110.0",
    "uvicorn[standard]>=0.28.0",
    "httpx>=0.27.0",
    "pydantic>=2.6.0",
    "pyahocorasick>=2.1.0",
    "numpy>=1.26.0",
    "regex>=2024.0.0",
    "rich>=13.7.0",
]

[project.optional-dependencies]
dev = [
    "onnx>=1.16.0",
    "onnxruntime>=1.17.0",
    "pytest>=8.0.0",
    "ruff>=0.3.0",
]

[project.scripts]
glados = "glados:main"

[build-system]
requires = ["uv_build>=0.13.1,<0.14.0"]
build-backend = "uv_build"
